general {
    lock_cmd = qs ipc call lock lock || hyprlock   # quickshell lock, hyprlock if qs is not running
    before_sleep_cmd = loginctl lock-session    # lock before suspend
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({action = "on"})'  # wake screens after resume
}

# NOTE: Hyprland's Lua config needs the hl.dsp.* syntax; `hyprctl dispatch dpms off` fails silently.

listener {
    timeout = 300                               # 5 min: screen off
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({action = "off"})'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({action = "on"})'
}

listener {
    timeout = 330                               # 5.5 min: lock
    on-timeout = loginctl lock-session
}

listener {
    timeout = 1800                              # 30 min: suspend (blocked while Claude Code holds an inhibitor)
    on-timeout = systemctl suspend
}
